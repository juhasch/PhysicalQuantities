name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [linux, amd64, docker]
    container:
      image: python:3.13-bullseye
    
    steps:
      - name: Install Node.js (required for checkout action)
        run: |
          apt-get update && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
      
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest --tb=short -v
      
      - name: Generate coverage report
        run: |
          pytest --cov=systemdesign --cov-report=xml --cov-report=html --cov-report=term
        continue-on-error: true
      
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            coverage=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f\"{float(root.get('line-rate')) * 100:.2f}%\")" 2>/dev/null || echo "N/A")
            echo "=========================================="
            echo "Coverage: $coverage"
            echo "=========================================="
            echo ""
            echo "Coverage reports are available as artifacts:"
            echo "- HTML report: Download the 'coverage' artifact and open htmlcov/index.html in a browser"
            echo "- XML report: Available in coverage.xml for integration with external tools"
            echo ""
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
              echo "**Coverage: $coverage**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Download the 'coverage' artifact to view the HTML report." >> $GITHUB_STEP_SUMMARY
            fi
          fi
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage
          path: |
            htmlcov/
            coverage.xml
        continue-on-error: true

